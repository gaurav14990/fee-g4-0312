<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaurav</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    font-family:"Lucida Sans", sans-serif;
    font-size:25px;
    background-color: #ffffff;
    color: #333333;
}

header{
    background: darkred;
    color: white;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

main{
    flex:1;
    display:flex;
}

.left{
    flex:1;
    background:#f4f4f4;
    border-right:4px solid white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.right{
    flex:1;
    background:#d9f2ff;
    display:flex;
    justify-content:center;
    align-items:center;
}

footer{
    background: darkred;
    color: white;
    padding: 20px 30px;
}
</style>

</head>
<body>

<header>
    <div style="font-weight: bold;">Gaurav</div>
    <div style="font-size: 18px;">Navbar</div>
</header>

<main>
    <div class="left">
        LEFT SECTION
    </div>

    <div class="right">
        RIGHT SECTION
    </div>
</main>

<footer>
    Gaurav &copy; 2026
</footer>

</body>
</html>
