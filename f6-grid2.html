<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        
        body{
            min-height: 100dvh;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            background-color: #121212;
            color: #e0e0e0;
        }

        section{
            padding: 10px;
        }

        .box{
            background-color: #1e1e1e;
            color: #e0e0e0;
            padding: 1rem;
            border: 1px solid #333;
        }

        .gc{
            display: grid;
            gap: 0.5rem;
            grid-template-columns: repeat(3,150px);
            grid-template-rows: repeat(3,150px);
            place-content: center;
        }

        #m1{
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 2;
        }

        #m2{
            grid-column-start: 3;
            grid-column-end: 4;
            grid-row-start: 1;
            grid-row-end: 3;
        }

         #m3{
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 2;
            grid-row-end: 4;
        }

         #m5{
            grid-column-start: 2;
            grid-column-end: 4;
            grid-row-start: 3;
            grid-row-end: 4;
        }

         @media (min-width: 360px){
        .gc{
            grid-template-columns: 150px 150px 150px;
            grid-template-rows: 150px 150px 150px;
        }
        }

        @media (min-width: 767px){
        .gc{
            grid-template-columns: 250px 250px 250px;
            grid-template-rows: 150px 150px 150px;
        }
        }

        @media(min-width: 1024px){
        .gc{
            grid-template-columns: 350px 350px 350px;
            grid-template-rows: 150px 150px 150px;
        }
        }
    </style>
</head>
<body>
    <section class="box" style="height: 10vh; display: flex; align-items: center; border-bottom: 1px solid #333;">
        <span style="font-size: 2.5rem; margin-right: 1rem;">&#9812;</span>
        Gaurav
    </section>
    <section class="box gc" style="height: 80vh; background-color: #121212; border: none;">
        <main class="box" id="m1">Content-1</main>
        <main class="box" id="m2">Content-2</main>
        <main class="box" id="m3">Content-3</main>
        <main class="box" id="m4">Content-4</main>
        <main class="box" id="m5">Content-5</main>
    </section>
    <section class="box"
             style="position: absolute;
                    bottom: 0px;
                    left: 0px;
                    height: 10vh;
                    width: 100%;
                    display: flex;
                    align-items: center;
                    border-top: 1px solid #333;">
        <span style="font-size: 1.5rem; margin-right: 1rem;">&#9776;</span>
        Footer - Gaurav &copy; 2026
    </section>
</body>
</html>
